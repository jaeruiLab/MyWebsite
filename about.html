<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About · Jierui</title>
  <meta name="description" content="Why chemistry, computer science, and chemical engineering are one hobby, not three.">
  <script>
    /* Set theme + "js" flag before first paint so there's no flash. */
    (function () {
      var d = document.documentElement, t;
      d.classList.add("js");
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      d.dataset.theme = t;
    })();
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-page="about">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header" id="site-header"></header>

  <main id="main" tabindex="-1">
    <noscript><p class="wrap" style="padding-top:40px">This site builds its pages with JavaScript (it's a code kid's site, of course there's a script). Please turn it on to see the content.</p></noscript>
    <section class="wrap page-head">
      <p class="prompt"><span class="prompt-path">~/lab</span> $ cat about.md</p>
      <h1>About <span class="rx-arrow" aria-hidden="true">⇌</span> me</h1>

    </section>

    <section class="wrap about-grid">
      <div class="about-text" id="about-text"></div>
      <figure class="photo reveal">
        <div id="about-photo"></div>
        <figcaption id="about-photo-caption"></figcaption>
      </figure>
    </section>

    <section class="wrap section">
      <div class="card fav-molecule reveal" id="fav-molecule"></div>
    </section>

    <section class="wrap section" aria-labelledby="facts-title">
      <h2 class="section-title" id="facts-title">Fun facts (peer-reviewed by nobody)</h2>
      <ul class="fun-facts" id="fun-facts"></ul>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
